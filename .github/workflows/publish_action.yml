name: Publish to Comfy Registry

# A release is an explicit act: push a tag (v0.X.Y) after bumping the
# version in pyproject.toml and __init__.py, or press "Run workflow".
# Deliberately NOT triggered by pyproject.toml edits on main: the
# registry rejects unchanged versions, and the file changes for
# non-release reasons too.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
